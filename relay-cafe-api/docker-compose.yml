# Local dev stack: API + Postgres + Redis with Upstash-compatible REST proxy.
# Usage: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: relaycafe
      POSTGRES_PASSWORD: relaycafe
      POSTGRES_DB: relaycafe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaycafe"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redis-rest:
    image: hiett/serverless-redis-http:latest
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-token
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  api:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://relaycafe:relaycafe@postgres:5432/relaycafe
      # Rate limiting uses in-memory fallback for local dev.
      # SRH doesn't support the Lua scripting commands @upstash/ratelimit needs.
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
    volumes:
      - ./gcp-credentials.json:/app/gcp-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
